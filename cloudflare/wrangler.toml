name = "timesheet-cloudflare-prod"
main = "src/index.js"
compatibility_date = "2026-09-11"

[assets]
directory = "./public"
not_found_handling = "single-page-application"

[env.dev]
name = "timesheet-cloudflare-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "timesheet-db-dev"
database_id = "fdae27f2-724b-40fb-9822-61bfeff212a2"

[env.dev.vars]
APP_NAME = "Timesheet (Dev)"
RESEND_FROM_EMAIL = "Timesheet Dev <onboarding@resend.dev>"

[env.test]
name = "timesheet-cloudflare-test"

[[env.test.d1_databases]]
binding = "DB"
database_name = "timesheet-db-test"
database_id = "b30c5644-aae3-4659-ad90-d58d811a9110"

[env.test.vars]
APP_NAME = "Timesheet (Test)"

[env.prod]
name = "timesheet-cloudflare-prod"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "timesheet-db"
database_id = "bf9ffa55-5af3-4bab-af98-8b61b8a7f8fc"

[env.prod.vars]
APP_NAME = "Timesheet"
